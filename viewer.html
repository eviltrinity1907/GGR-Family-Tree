<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<title>Ganga Reddy Gaddam Family</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14181D; }
  * { box-sizing: border-box; }
  #root { height: 100%; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useLayoutEffect, useRef, useMemo } = React;

/* =========================================================================
   CONFIG — fill these in after sharing the Drive file (see SETUP-VIEWER.md)
   ========================================================================= */
const DRIVE_FILE_ID = "1Ui-5wM5EYs8grQZ-uLaIIl5D9NTj1A3w";
const DRIVE_API_KEY = "AIzaSyBoHyFmsG-UZ2_hpK0XyxOO87KfnDKvb8Q";

/* ---------------------------------------------------------------------
   Small helpers (identical layout engine to the editor app)
   --------------------------------------------------------------------- */
const PALETTE = ["#5B8AA6", "#4FD1C5", "#A78BC4", "#D99A5B", "#6FA88A", "#C97B84"];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function initials(name) {
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0] || "") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

function toRoman(num) {
  const map = [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let n = num, out = "";
  for (const [val, sym] of map) {
    while (n >= val) { out += sym; n -= val; }
  }
  return out || "I";
}

function computeGenerations(people) {
  const byId = Object.fromEntries(people.map((p) => [p.id, p]));
  const memo = {};
  function depth(id, seen) {
    if (memo[id] !== undefined) return memo[id];
    if (seen.has(id)) return 0;
    const p = byId[id];
    if (!p || p.parentIds.length === 0) return (memo[id] = 0);
    seen.add(id);
    const d = 1 + Math.max(...p.parentIds.map((pid) => (byId[pid] ? depth(pid, seen) : -1)));
    seen.delete(id);
    return (memo[id] = d);
  }
  people.forEach((p) => depth(p.id, new Set()));
  people.forEach((p) => {
    p.spouseIds.forEach((sid) => {
      if (byId[sid] && memo[sid] < memo[p.id]) memo[sid] = memo[p.id];
    });
  });
  return memo;
}

function buildRows(people, generations) {
  const byId = Object.fromEntries(people.map((p) => [p.id, p]));
  const maxGen = people.length ? Math.max(...Object.values(generations)) : 0;
  const rows = [];
  for (let g = 0; g <= maxGen; g++) {
    const idsInGen = people.filter((p) => generations[p.id] === g).map((p) => p.id);
    const placed = new Set();
    const units = [];
    idsInGen.forEach((id) => {
      if (placed.has(id)) return;
      const p = byId[id];
      const spouse = p.spouseIds.find((sid) => idsInGen.includes(sid) && !placed.has(sid));
      if (spouse) {
        units.push([id, spouse]);
        placed.add(id);
        placed.add(spouse);
      } else {
        units.push([id]);
        placed.add(id);
      }
    });
    rows.push(units);
  }
  return rows;
}

const CARD_W = 192, CARD_H = 160, COUPLE_GAP = 16, SIBLING_GAP = 50, ROOT_GAP = 70, ROW_HEIGHT = 290, PADDING = 40;

function computeLayout(people) {
  if (people.length === 0) return { positions: {}, lines: [], width: 400, height: 300 };
  const byId = Object.fromEntries(people.map((p) => [p.id, p]));
  const generations = computeGenerations(people);
  const rows = buildRows(people, generations);

  const unitKeyOf = {};
  const unitInfo = {};
  rows.forEach((units, gi) => {
    units.forEach((ids) => {
      const key = ids.join("+");
      ids.forEach((id) => (unitKeyOf[id] = key));
      unitInfo[key] = { ids, gen: gi };
    });
  });

  const childUnitsOf = {};
  people.forEach((p) => {
    if (p.parentIds.length === 0) return;
    const parentUnitKey = unitKeyOf[p.parentIds[0]] || unitKeyOf[p.parentIds[1]];
    if (!parentUnitKey) return;
    const childUnitKey = unitKeyOf[p.id];
    if (!childUnitKey) return;
    if (!childUnitsOf[parentUnitKey]) childUnitsOf[parentUnitKey] = [];
    if (!childUnitsOf[parentUnitKey].includes(childUnitKey)) childUnitsOf[parentUnitKey].push(childUnitKey);
  });

  const nodeWidth = (key) => (unitInfo[key].ids.length === 2 ? CARD_W * 2 + COUPLE_GAP : CARD_W);

  const widthCache = {};
  const subtreeWidth = (key) => {
    if (widthCache[key] !== undefined) return widthCache[key];
    const kids = childUnitsOf[key] || [];
    let w;
    if (kids.length === 0) w = nodeWidth(key);
    else {
      const kidsTotal = kids.reduce((s, k) => s + subtreeWidth(k), 0) + SIBLING_GAP * (kids.length - 1);
      w = Math.max(nodeWidth(key), kidsTotal);
    }
    widthCache[key] = w;
    return w;
  };

  const centerX = {};
  const assignX = (key, left) => {
    const w = subtreeWidth(key);
    const cx = left + w / 2;
    centerX[key] = cx;
    const kids = childUnitsOf[key] || [];
    if (kids.length > 0) {
      const kidsTotal = kids.reduce((s, k) => s + subtreeWidth(k), 0) + SIBLING_GAP * (kids.length - 1);
      let cursor = cx - kidsTotal / 2;
      kids.forEach((k) => {
        const kw = subtreeWidth(k);
        assignX(k, cursor);
        cursor += kw + SIBLING_GAP;
      });
    }
  };

  const rootKeys = Object.keys(unitInfo).filter((k) => unitInfo[k].gen === 0);
  let cursor = 0;
  rootKeys.forEach((k) => {
    assignX(k, cursor);
    cursor += subtreeWidth(k) + ROOT_GAP;
  });

  const positions = {};
  Object.entries(unitInfo).forEach(([key, { ids, gen }]) => {
    const cx = centerX[key];
    const y = gen * ROW_HEIGHT;
    if (ids.length === 2) {
      const totalW = CARD_W * 2 + COUPLE_GAP;
      positions[ids[0]] = { x: cx - totalW / 2 + CARD_W / 2, y };
      positions[ids[1]] = { x: cx + totalW / 2 - CARD_W / 2, y };
    } else {
      positions[ids[0]] = { x: cx, y };
    }
  });

  const minLeft = Math.min(...Object.values(positions).map((p) => p.x - CARD_W / 2));
  const offsetX = PADDING - minLeft;
  Object.values(positions).forEach((p) => (p.x += offsetX));
  Object.keys(centerX).forEach((k) => (centerX[k] += offsetX));

  const lines = [];
  people.forEach((p) => {
    p.spouseIds.forEach((sid) => {
      if (p.id < sid && positions[p.id] && positions[sid]) {
        const a = positions[p.id];
        const b = positions[sid];
        const y = a.y + CARD_H / 2;
        const [leftX, rightX] = a.x < b.x ? [a.x, b.x] : [b.x, a.x];
        lines.push({ type: "spouse", x1: leftX + CARD_W / 2, y1: y, x2: rightX - CARD_W / 2, y2: y });
      }
    });
  });
  Object.entries(childUnitsOf).forEach(([parentKey, kids]) => {
    const parentCx = centerX[parentKey];
    const parentY = unitInfo[parentKey].gen * ROW_HEIGHT + CARD_H;
    const parentIdsSet = new Set(unitInfo[parentKey].ids);
    kids.forEach((childKey) => {
      unitInfo[childKey].ids.forEach((cid) => {
        const person = byId[cid];
        if (!person) return;
        const isBloodChild = person.parentIds.some((pid) => parentIdsSet.has(pid));
        if (!isBloodChild) return;
        const pos = positions[cid];
        if (!pos) return;
        const bendY = parentY + (pos.y - parentY) / 2;
        lines.push({ type: "parent", path: `M ${parentCx} ${parentY} V ${bendY} H ${pos.x} V ${pos.y}` });
      });
    });
  });

  const maxGen = Math.max(...Object.values(unitInfo).map((u) => u.gen), 0);
  const maxRight = Math.max(...Object.values(positions).map((p) => p.x + CARD_W / 2));
  const width = maxRight + PADDING;
  const height = (maxGen + 1) * ROW_HEIGHT + PADDING;

  return { positions, lines, width, height, maxGen, generations };
}

/* =========================================================================
   App — fetches the public Drive file, no sign-in, no editing
   ========================================================================= */
function App() {
  const [people, setPeople] = useState([]);
  const [status, setStatus] = useState("loading…");
  const [selectedId, setSelectedId] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [brokenPhotos, setBrokenPhotos] = useState({});
  const containerRef = useRef(null);
  const pinchRef = useRef({ active: false, startDist: 0, startZoom: 1 });
  const anchorRef = useRef(null);

  const load = () => {
    setStatus("loading…");
    fetch(`https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media&key=${DRIVE_API_KEY}`)
      .then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then((data) => {
        setPeople(Array.isArray(data) ? data : []);
        setStatus("updated " + new Date().toLocaleTimeString());
      })
      .catch((e) => setStatus("couldn't load: " + e.message));
  };

  useEffect(() => { load(); }, []);

  const clampZoom = (v) => Math.min(2.2, Math.max(0.3, v));
  const zoomIn = () => setZoom((z) => clampZoom(z + 0.15));
  const zoomOut = () => setZoom((z) => clampZoom(z - 0.15));
  const resetZoom = () => setZoom(1);
  const touchDist = (touches) => {
    const [a, b] = touches;
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  };
  const touchMid = (touches) => {
    const [a, b] = touches;
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  };
  const handleTouchStart = (e) => {
    if (e.touches.length === 2) pinchRef.current = { active: true, startDist: touchDist(e.touches), startZoom: zoom };
  };
  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && pinchRef.current.active) {
      e.preventDefault();
      const container = containerRef.current;
      const rect = container.getBoundingClientRect();
      const mid = touchMid(e.touches);
      const midX = mid.x - rect.left;
      const midY = mid.y - rect.top;
      // record the content point currently under the fingers, in unscaled coordinates
      anchorRef.current = {
        contentX: (container.scrollLeft + midX) / zoom,
        contentY: (container.scrollTop + midY) / zoom,
        midX,
        midY,
      };
      setZoom(clampZoom(pinchRef.current.startZoom * (touchDist(e.touches) / pinchRef.current.startDist)));
    }
  };
  const handleTouchEnd = (e) => { if (e.touches.length < 2) pinchRef.current.active = false; };
  const handleWheel = (e) => {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom((z) => clampZoom(z - e.deltaY * 0.001)); }
  };

  // after zoom changes, re-anchor scroll so the pinched point stays under the fingers
  useLayoutEffect(() => {
    const anchor = anchorRef.current;
    const container = containerRef.current;
    if (!anchor || !container) return;
    container.scrollLeft = anchor.contentX * zoom - anchor.midX;
    container.scrollTop = anchor.contentY * zoom - anchor.midY;
  }, [zoom]);

  const { positions, lines, width, height, maxGen, generations } = useMemo(() => computeLayout(people), [people]);

  return (
    <div style={{ fontFamily: "'Inter', sans-serif", background: "#14181D", height: "100%", color: "#E7EBEF", display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 20px 12px", borderBottom: "1px solid #2B323B", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
        <div>
          <div style={{ fontSize: 19, fontWeight: 600 }}>Ganga Reddy Gaddam Family</div>
          <div style={{ fontSize: 11.5, color: "#8B95A3", fontFamily: "'Inter', sans-serif" }}>
            {people.length} people · {status} · 🔒 view only
          </div>
        </div>
        <button onClick={load} style={{ padding: "8px 12px", borderRadius: 8, border: "1px solid #2B323B", background: "#fff", fontSize: 12.5, fontFamily: "'Inter', sans-serif", cursor: "pointer" }}>
          ⟳ Refresh
        </button>
      </div>

      <div ref={containerRef} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onWheel={handleWheel}
        style={{ flex: 1, overflow: "auto", position: "relative", minHeight: 300, touchAction: "pan-x pan-y" }}>
        {people.length === 0 ? (
          <div style={{ textAlign: "center", marginTop: 60, color: "#8B95A3", fontFamily: "'Inter', sans-serif" }}>
            <div style={{ fontSize: 15 }}>Nothing here yet.</div>
          </div>
        ) : (
          <div style={{ position: "relative", width: width * zoom, height: height * zoom, margin: "24px auto" }}>
            <div style={{ position: "relative", width, height, transform: `scale(${zoom})`, transformOrigin: "0 0" }}>
              <svg style={{ position: "absolute", top: 0, left: 0, width, height, pointerEvents: "none", overflow: "visible" }}>
                {lines.map((l, i) => l.type === "spouse"
                  ? <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke="#4FD1C5" strokeWidth={2} />
                  : <path key={i} d={l.path} fill="none" stroke="#3A4149" strokeWidth={1.6} />
                )}
              </svg>
              {Array.from({ length: maxGen + 1 }).map((_, gen) => {
                const y = gen * ROW_HEIGHT + CARD_H + (ROW_HEIGHT - CARD_H) / 2;
                const REPEAT = 700;
                const count = Math.max(1, Math.ceil(width / REPEAT));
                return Array.from({ length: count }).map((_, i) => (
                  <div
                    key={`gen-${gen}-${i}`}
                    style={{
                      position: "absolute",
                      left: i * REPEAT + 6,
                      top: y,
                      transform: "translateY(-50%)",
                      fontSize: 10.5,
                      fontWeight: 600,
                      color: "#4FD1C5",
                      background: "#1C2127",
                      border: "1px solid #2B323B",
                      borderRadius: 999,
                      padding: "2px 8px",
                      fontFamily: "'Inter', sans-serif",
                      pointerEvents: "none",
                      whiteSpace: "nowrap",
                      zIndex: 0,
                    }}
                  >
                    Gen {gen + 1}
                  </div>
                ));
              })}
            {people.map((p) => {
              const pos = positions[p.id];
              if (!pos) return null;
              const c = colorFor(p.name);
              const selected = selectedId === p.id;
              const photoOk = p.photoUrl && !brokenPhotos[p.id];
              const InfoLine = ({ icon, value }) => (
                <div style={{ fontSize: 11, color: value ? "#C7CDD4" : "#4B5560", fontFamily: "'Inter', sans-serif", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", display: "flex", gap: 5 }}>
                  <span style={{ flexShrink: 0 }}>{icon}</span>
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{value || "—"}</span>
                </div>
              );
              return (
                <div key={p.id} onClick={() => setSelectedId(selected ? null : p.id)}
                  style={{ position: "absolute", left: pos.x - CARD_W / 2, top: pos.y, width: CARD_W, background: "rgba(28,33,39,0.92)", border: selected ? `2px solid ${c}` : "1px solid rgba(201,162,75,0.35)", borderRadius: 10, padding: "12px 12px 10px", cursor: "pointer", boxShadow: selected ? "0 4px 14px rgba(0,0,0,0.35)" : "0 2px 8px rgba(0,0,0,0.25)", zIndex: selected ? 2 : 1 }}>
                  {generations[p.id] !== undefined && (
                    <div style={{
                      position: "absolute", top: -11, right: -6, width: 26, height: 26, borderRadius: "50%",
                      background: "#1C2127", border: "1.5px solid #C9A24B", display: "flex", alignItems: "center", justifyContent: "center",
                      fontFamily: "'Cinzel', serif", fontWeight: 600, fontSize: 10, color: "#C9A24B", zIndex: 3,
                    }}>
                      {toRoman(generations[p.id] + 1)}
                    </div>
                  )}
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    {photoOk ? (
                      <img src={p.photoUrl} alt="" style={{ width: 36, height: 36, borderRadius: "50%", objectFit: "cover", flexShrink: 0, background: "#242A32" }}
                        onError={() => setBrokenPhotos((prev) => ({ ...prev, [p.id]: true }))} />
                    ) : (
                      <div style={{ width: 36, height: 36, borderRadius: "50%", background: c, color: "#0B1418", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontFamily: "'Cormorant Garamond', serif", fontWeight: 600, flexShrink: 0 }}>
                        {initials(p.name) || "?"}
                      </div>
                    )}
                    <div style={{ overflow: "hidden", minWidth: 0, flex: 1 }}>
                      <div style={{ fontSize: 14.5, fontWeight: 600, fontFamily: "'Cormorant Garamond', serif", color: "#F0DCC0", whiteSpace: selected ? "normal" : "nowrap", overflow: selected ? "visible" : "hidden", textOverflow: selected ? "clip" : "ellipsis" }}>{p.name}</div>
                    </div>
                  </div>
                  <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 3 }}>
                    <InfoLine icon="🎂" value={p.dob} />
                    <InfoLine icon="⚥" value={p.gender} />
                    <InfoLine icon="💼" value={p.occupation} />
                    <InfoLine icon="🏡" value={p.hometown} />
                    <InfoLine icon="📍" value={p.currentlyLiving} />
                  </div>
                  {selected && (
                    <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px solid #242A32", fontFamily: "'Inter', sans-serif" }}>
                      {photoOk && (
                        <img src={p.photoUrl} alt="" style={{ width: "100%", height: 120, objectFit: "cover", borderRadius: 8, marginBottom: 8, background: "#242A32" }}
                          onError={() => setBrokenPhotos((prev) => ({ ...prev, [p.id]: true }))} />
                      )}
                      {p.dod && <div style={{ fontSize: 11.5, color: "#C7CDD4", marginBottom: 4 }}><strong>Passed away:</strong> {p.dod}</div>}
                      {p.notes && <div style={{ fontSize: 12, color: "#C7CDD4", marginBottom: 8 }}>{p.notes}</div>}
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, fontSize: 11, color: "#5B6572", fontFamily: "'Inter', sans-serif" }}>
                        ✕ Tap to close
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
            </div>
          </div>
        )}
        {people.length > 0 && (
          <div style={{ position: "sticky", bottom: 14, right: 14, float: "right", width: "fit-content", display: "flex", flexDirection: "column", gap: 6, background: "#1C2127", border: "1px solid #2B323B", borderRadius: 10, padding: 6, boxShadow: "0 4px 14px rgba(0,0,0,0.12)", fontFamily: "'Inter', sans-serif" }}>
            <button onClick={zoomIn} style={{ width: 30, height: 30, borderRadius: 7, border: "1px solid #2B323B", background: "#14181D", fontSize: 16, fontWeight: 700, cursor: "pointer" }}>+</button>
            <div style={{ textAlign: "center", fontSize: 11, color: "#8B95A3", padding: "2px 0" }}>{Math.round(zoom * 100)}%</div>
            <button onClick={zoomOut} style={{ width: 30, height: 30, borderRadius: 7, border: "1px solid #2B323B", background: "#14181D", fontSize: 16, fontWeight: 700, cursor: "pointer" }}>–</button>
            <button onClick={resetZoom} style={{ width: 30, height: 30, borderRadius: 7, border: "1px solid #2B323B", background: "#14181D", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>⟳</button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  var code = document.getElementById("app-source").textContent;
  var transformed = Babel.transform(code, { presets: ["react"] }).code;
  var runner = document.createElement("script");
  runner.textContent = transformed;
  document.body.appendChild(runner);
</script>
</body>
</html>
